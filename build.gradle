plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

// Keep the lightweight Gradle wrapper distribution.
tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel', 'src/generated/**/.cache')
}

repositories {
    // Runtime dependencies required by Create.
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup('software.bernie.geckolib') }
    }
}

// Minecraft 1.21.1 ships Java 21 to players.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client { client() }

        server {
            server()
            programArgument('--nogui')
        }

        // Generate data into the source tree while preserving existing resources for lookup.
        data {
            data()
            programArguments.addAll(
                    '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath)
        }
    }

    // Associates this source set with the mod ID for development runs and packaging.
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    // Development-only runtime dependencies are not exposed to downstream consumers.
    runtimeClasspath.extendsFrom(localRuntime)
}

dependencies {
    // Create's slim artifact requires these companion libraries to be declared explicitly.
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    implementation("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}")
}

// Expands mod metadata placeholders from the template before resources are packaged or indexed by the IDE.
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def properties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            geckolib_version       : geckolib_version
    ]
    inputs.properties(properties)
    expand(properties)
    from('src/main/templates')
    into('build/generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask(generateModMetadata)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Reject incomplete definitions and missing referenced assets before packaging resources.
tasks.register('validateArsenalDefinitions', com.fayetalerror.createarsenal.build.ValidateArsenalDefinitions) {
    resourcesDirectory.set(layout.projectDirectory.dir('src/main/resources'))
}

tasks.named('processResources').configure {
    dependsOn('validateArsenalDefinitions')
}

// Makes external dependency documentation available in IntelliJ IDEA.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
